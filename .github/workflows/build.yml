name: Build CAMI APKs
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build ${{ matrix.role }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [camera, viewer]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Installer dépendances
        run: npm install

      - name: 🏗️ Build Vite — ${{ matrix.role }}
        run: |
          if [ "${{ matrix.role }}" = "camera" ]; then
            npm run build:camera
            cp capacitor.config.camera.json capacitor.config.json
          else
            npm run build:viewer
            cp capacitor.config.viewer.json capacitor.config.json
          fi
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: 📱 Compiler APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 📤 Renommer l'APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk cami-${{ matrix.role }}-debug.apk

      - name: 💾 Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: cami-${{ matrix.role }}-apk
          path: cami-${{ matrix.role }}-debug.apk
          retention-days: 30
